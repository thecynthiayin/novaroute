[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]
markers = ["integration: requires isolated MySQL 8 test database", "real_model: downloads and exercises MiniLM", "mailpit: exercises local SMTP delivery"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# The isolated test URL must be installed before importing the application engine.
"tests/conftest.py" = ["E402"]
